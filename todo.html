<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas Sincronizado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Lista de Tareas</h1>
      <button onclick="fetchTasks()" class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded hover:bg-gray-300">
        🔄 Sincronizar
      </button>
    </div>

    <!-- Formulario -->
    <form id="taskForm" class="space-y-4 mb-8">
      <div>
        <label class="block text-sm font-medium text-gray-700">Tarea</label>
        <input type="text" id="descripcion" required class="w-full border rounded-lg p-2 mt-1 focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Categoría</label>
          <select id="categoria" class="w-full border rounded-lg p-2 mt-1">
            <option value="Tutoría">Tutoría</option>
            <option value="Gestión">Gestión</option>
            <option value="Clases">Clases</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Prioridad</label>
          <select id="prioridad" class="w-full border rounded-lg p-2 mt-1">
            <option value="Alta">Alta</option>
            <option value="Media" selected>Media</option>
            <option value="Baja">Baja</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Fecha Límite</label>
          <input type="date" id="fechaLimite" required class="w-full border rounded-lg p-2 mt-1">
        </div>
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">
        Añadir Tarea
      </button>
    </form>

    <!-- Lista de tareas -->
    <div id="loading" class="text-center py-4 text-gray-500">Cargando tareas de Google Sheets...</div>
    <div id="taskList" class="space-y-3"></div>
  </div>

  <script>
    // SUSTITUYE CON TU URL DE APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbuFnsJl63dcRAWZqO1vGLszyNES4lZSkkd8vPo078-wRvnavbw_UUy5OZZUmdUXWY/exec";

    let tasks = [];

    // Cargar tareas al abrir la web
    async function fetchTasks() {
      const loading = document.getElementById('loading');
      loading.classList.remove('hidden');
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        tasks = await response.json();
        renderTasks();
      } catch (err) {
        alert("Error al cargar las tareas: " + err.message);
      } finally {
        loading.classList.add('hidden');
      }
    }

    // Añadir nueva tarea
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Guardando...';

      const newTask = {
        id: "ID-" + Date.now(),
        descripcion: document.getElementById('descripcion').value,
        categoria: document.getElementById('categoria').value,
        prioridad: document.getElementById('prioridad').value,
        fechaInclusion: new Date().toISOString().split('T')[0],
        fechaLimite: document.getElementById('fechaLimite').value
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "create", task: newTask })
        });

        document.getElementById('taskForm').reset();
        // Esperamos un segundo antes de refrescar para que Sheets procese los datos
        setTimeout(fetchTasks, 1000);
      } catch (err) {
        alert("Error al guardar la tarea: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Añadir Tarea';
      }
    });

    // Completar tarea
    async function completeTask(id) {
      if (!confirm("¿Marcar esta tarea como completada?")) return;

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "complete", taskId: id })
        });

        setTimeout(fetchTasks, 1000);
      } catch (err) {
        alert("Error al completar la tarea: " + err.message);
      }
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      if (!Array.isArray(tasks) || tasks.length === 0) {
        list.innerHTML = '<p class="text-gray-500 text-center py-4">No hay tareas pendientes.</p>';
        return;
      }

      tasks.forEach(task => {
        const item = document.createElement('div');
        item.className = 'border rounded-lg p-4 flex justify-between items-center bg-gray-50 shadow-sm';
        item.innerHTML = `
          <div>
            <div class="font-semibold text-gray-800">${task.descripcion}</div>
            <div class="text-xs text-gray-500 mt-1 space-x-2">
              <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded">${task.categoria}</span>
              <span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded">Prioridad: ${task.prioridad}</span>
              <span>Inclusión: ${task.fechaInclusion}</span>
              <span class="font-medium text-red-600">Límite: ${task.fechaLimite}</span>
            </div>
          </div>
          <button onclick="completeTask('${task.id}')" class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">
            Completar
          </button>
        `;
        list.appendChild(item);
      });
    }

    // Carga inicial
    fetchTasks();
  </script>
</body>
</html>
