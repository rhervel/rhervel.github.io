<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Rafael Heredia</title>
    <link href="assets/css/styles.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfd;
            background-image: 
                linear-gradient(#f1f5f9 1px, transparent 1px),
                linear-gradient(90deg, #f1f5f9 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .nav-glass {
            background: rgba(252, 252, 253, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .contact-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }

        .input-field {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            background: white;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-send {
            background: #0f172a;
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            width: 100%;
            cursor: pointer;
        }

        .btn-send:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 nav-glass">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index.html" class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-black text-sm">T</div>
                    <span class="font-black text-slate-900 tracking-tighter uppercase text-sm">rhervel</span>
                </a>
            </div>
            <div class="hidden md:flex items-center gap-8 text-[10px] font-black uppercase tracking-widest text-slate-500">
                <a href="index.html" class="hover:text-indigo-600 transition-colors">Inicio</a>
                <a href="blog/blog.html" class="hover:text-indigo-600 transition-colors">Blog</a>
                <a href="contacto.html" class="text-indigo-600">Contacto</a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="pt-32 pb-24 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                
                <!-- Left: Info -->
                <div>
                    <div class="inline-flex items-center gap-2 text-indigo-600 font-black text-[10px] uppercase tracking-[0.3em] mb-6">
                        <span class="px-3 py-1 bg-indigo-100 rounded-full">Hablemos</span>
                    </div>
                    <h1 class="text-5xl font-black text-slate-900 tracking-tighter mb-6 leading-tight">
                        ¿Tienes un proyecto en mente?
                    </h1>
                    <p class="text-lg text-slate-500 mb-10 leading-relaxed">
                        Estoy disponible para colaboraciones, conferencias sobre tecnología 3D o simplemente para charlar sobre el futuro digital.
                    </p>

                    <div class="space-y-6">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white rounded-2xl border border-slate-100 flex items-center justify-center shadow-sm">
                                <i data-lucide="mail" class="w-5 h-5 text-indigo-600"></i>
                            </div>
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Email</p>
                                <p class="font-bold text-slate-900">contacto@rhervel.tech</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white rounded-2xl border border-slate-100 flex items-center justify-center shadow-sm">
                                <i data-lucide="map-pin" class="w-5 h-5 text-indigo-600"></i>
                            </div>
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Ubicación</p>
                                <p class="font-bold text-slate-900">España</p>
                            </div>
                        </div>
                    </div>

                    <div class="mt-12 pt-12 border-t border-slate-200">
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4">Redes sociales</p>
                        <div class="flex gap-4">
                            <a href="#" class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center text-white hover:bg-indigo-600 transition-colors">
                                <i data-lucide="linkedin" class="w-4 h-4"></i>
                            </a>
                            <a href="#" class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center text-white hover:bg-indigo-600 transition-colors">
                                <i data-lucide="twitter" class="w-4 h-4"></i>
                            </a>
                            <a href="#" class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center text-white hover:bg-indigo-600 transition-colors">
                                <i data-lucide="github" class="w-4 h-4"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Right: Form -->
                <div class="contact-card p-8 md:p-12">
                    <form id="contactForm" action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
                        
                        <!-- Pega tu clave de Web3Forms aquí -->
                        <input type="hidden" name="access_key" value="2030f762-8cff-4b29-9fe7-0b8abf3a513f">
                        
                        <!-- Protección Anti-Spam de Web3Forms -->
                        <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Nombre</label>
                                <input type="text" name="name" required class="input-field" placeholder="Tu nombre">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Email</label>
                                <input type="email" name="email" required class="input-field" placeholder="tu@email.com">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Asunto</label>
                            <input type="text" name="subject" class="input-field" placeholder="¿En qué puedo ayudarte?">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Mensaje</label>
                            <textarea name="message" rows="5" required class="input-field" placeholder="Escribe tu mensaje aquí..."></textarea>
                        </div>

                        <button type="submit" id="submitBtn" class="btn-send">
                            Enviar mensaje
                        </button>

                        <!-- Mensaje de estado -->
                        <p id="formResult" class="text-center text-xs font-bold mt-4 hidden"></p>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-12 text-center">
        <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.4em]">rhervel // 2026</p>
    </footer>

    <script>
        lucide.createIcons();

        // Envío mediante AJAX para evitar redirecciones de página
        const form = document.getElementById('contactForm');
        const result = document.getElementById('formResult');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'ENVIANDO...';
            result.classList.remove('hidden', 'text-emerald-600', 'text-rose-600');
            result.classList.add('text-slate-500');
            result.innerText = 'Procesando...';

            const formData = new FormData(form);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(async (response) => {
                let json = await response.json();
                if (response.status == 200) {
                    result.classList.remove('text-slate-500');
                    result.classList.add('text-emerald-600');
                    result.innerText = '¡Mensaje enviado con éxito!';
                    form.reset();
                } else {
                    result.classList.remove('text-slate-500');
                    result.classList.add('text-rose-600');
                    result.innerText = json.message || 'Ocurrió un error. Inténtalo de nuevo.';
                }
            })
            .catch(error => {
                result.classList.remove('text-slate-500');
                result.classList.add('text-rose-600');
                result.innerText = 'Error al conectar con el servidor.';
            })
            .then(function() {
                submitBtn.disabled = false;
                submitBtn.innerText = 'ENVIAR MENSAJE';
            });
        });
    </script>
</body>
</html>
