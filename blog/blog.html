<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TechVerse — Tech, Design & Innovation</title>
        <link href="../assets/css/styles.css" rel="stylesheet">
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        
        body, h1, h2, h3, h4, .font-sans {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfd;
            background-image: 
                linear-gradient(#f1f5f9 1px, transparent 1px),
                linear-gradient(90deg, #f1f5f9 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .nav-glass {
            background: rgba(252, 252, 253, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        </style>
    </head>
    <body class="text-slate-800 selection:bg-indigo-50 selection:text-indigo-900 min-h-screen flex flex-col antialiased">
        
        <!-- Header / Navbar -->
        <nav class="fixed top-0 w-full z-50 nav-glass">
            <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="goHome()">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-black text-sm">T</div>
                    <span class="font-black text-slate-900 tracking-tighter uppercase text-sm">rhervel</span>
                </div>
                
                <div class="flex items-center gap-8 text-[10px] font-black uppercase tracking-widest text-slate-500">
                    <div class="hidden md:flex items-center gap-8">
                        <a href="../index.html" class="hover:text-indigo-600 transition-colors">Inicio</a>
                        <a href="../index.html#asignaturas" class="hover:text-indigo-600 transition-colors">Asignaturas</a>
                        <a href="#" class="text-indigo-600" onclick="goHome(); return false;">Blog</a>
                        <a href="../contacto.html" class="px-4 py-2 bg-slate-900 text-white rounded-full hover:bg-indigo-600 transition-all">Contacto</a>
                    </div>
                    
                    <div class="flex bg-slate-100 p-0.5 rounded-lg text-[10px] font-semibold border border-slate-200">
                        <button id="lang-es" onclick="changeLanguage('es')" class="px-2.5 py-1 rounded-md bg-white shadow-sm text-slate-900 transition">ES</button>
                        <button id="lang-en" onclick="changeLanguage('en')" class="px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-900 transition">EN</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-grow max-w-7xl w-full mx-auto px-6 pt-28 pb-12">
            <!-- Vista de Inicio -->
            <div id="homeView" class="space-y-12">
                <!-- Hero Open, Clean con acento Índigo sutil -->
                <div class="relative py-4 border-b border-slate-200/60">
                    <div class="max-w-2xl space-y-3">
                        <div id="hero-tag-container" class="inline-flex items-center gap-2 text-indigo-600 font-black text-[10px] uppercase tracking-[0.3em]">
                            <i data-lucide="book-open" class="w-4 h-4"></i>
                            <span id="hero-tag">Bitácora Digital</span>
                        </div>
                        <h1 id="hero-title" class="text-4xl md:text-6xl font-black text-slate-900 tracking-tighter leading-tight">Explora el futuro digital.</h1>
                        <p id="hero-desc" class="text-slate-500 text-base font-medium leading-relaxed">Análisis profundos sobre Inteligencia Artificial, desarrollo de software, arquitectura de hardware y tendencias globales.</p>
                        
                        <div class="pt-2 max-w-sm">
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-3.5 top-3 text-slate-400 w-4 h-4"></i>
                                <input type="text" id="searchInput" oninput="filterArticles()" placeholder="Buscar artículos..." class="w-full bg-white border border-slate-200 text-slate-900 pl-10 pr-4 py-2 rounded-xl text-xs font-medium focus:outline-none focus:border-indigo-400 shadow-sm transition">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Navegación de Categorías -->
                <div class="overflow-x-auto">
                    <nav class="flex space-x-6 pb-2 text-xs font-semibold border-b border-slate-200/60" id="categoryTabs">
                        <button id="btn-todos" onclick="changeCategory('todos')" class="category-btn whitespace-nowrap text-indigo-600 border-b-2 border-indigo-600 pb-2 font-black uppercase text-[10px] tracking-widest">Todos</button>
                        <button id="btn-ia" onclick="changeCategory('ia')" class="category-btn whitespace-nowrap text-slate-400 hover:text-indigo-600 pb-2 font-bold uppercase text-[10px] tracking-widest transition">Inteligencia Artificial</button>
                        <button id="btn-desarrollo" onclick="changeCategory('desarrollo')" class="category-btn whitespace-nowrap text-slate-400 hover:text-indigo-600 pb-2 font-bold uppercase text-[10px] tracking-widest transition">Software</button>
                        <button id="btn-hardware" onclick="changeCategory('hardware')" class="category-btn whitespace-nowrap text-slate-400 hover:text-indigo-600 pb-2 font-bold uppercase text-[10px] tracking-widest transition">Hardware</button>
                        <button id="btn-ciberseguridad" onclick="changeCategory('ciberseguridad')" class="category-btn whitespace-nowrap text-slate-400 hover:text-indigo-600 pb-2 font-bold uppercase text-[10px] tracking-widest transition">Ciberseguridad</button>
                        <button id="btn-arduino" onclick="changeCategory('arduino')" class="category-btn whitespace-nowrap text-slate-400 hover:text-indigo-600 pb-2 font-bold uppercase text-[10px] tracking-widest transition">Arduino</button>
                        <button id="btn-tendencias" onclick="changeCategory('tendencias')" class="category-btn whitespace-nowrap text-slate-400 hover:text-indigo-600 pb-2 font-bold uppercase text-[10px] tracking-widest transition">Tendencias</button>
                    </nav>
                </div>

                <!-- Parrilla de Artículos -->
                <div id="articlesGrid" class="grid grid-cols-1 md:grid-cols-12 gap-8"></div>
            </div>

            <!-- Vista de Artículo -->
            <div id="articleView" class="hidden max-w-6xl mx-auto space-y-8">
                <button onclick="goHome()" class="inline-flex items-center space-x-2 text-xs font-bold text-slate-500 hover:text-indigo-600 transition group">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5 transform group-hover:-translate-x-0.5 transition"></i>
                    <span id="btn-back">Volver</span>
                </button>

                <article class="space-y-6 bg-white border border-slate-200 p-8 md:p-12 rounded-[2.5rem] shadow-sm">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                        <div class="flex items-center space-x-3">
                            <span id="articleCategoryTag" class="text-[10px] font-black bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full uppercase tracking-widest">CATEGORÍA</span>
                            <span id="articleReadingTime" class="text-xs text-slate-400 font-medium flex items-center"><i data-lucide="clock" class="w-3.5 h-3.5 mr-1"></i> 5 min</span>
                        </div>
                        <button onclick="copyArticleLink()" class="p-2 text-slate-400 hover:text-slate-900 hover:bg-slate-50 rounded-lg transition">
                            <i data-lucide="share" class="w-4 h-4"></i>
                        </button>
                    </div>
                    
                    <h1 id="articleTitle" class="text-3xl md:text-5xl font-black tracking-tight text-slate-900 leading-tight"></h1>
                    
                    <div id="articleImageContainer" class="hidden w-full h-64 md:h-[380px] rounded-2xl overflow-hidden bg-slate-50 my-6">
                        <img id="articleImage" src="" alt="" class="w-full h-full object-cover">
                    </div>

                    <div id="articleContent" class="prose prose-slate max-w-none text-slate-600 font-normal leading-relaxed space-y-6 text-sm md:text-base"></div>
                </article>
            </div>
        </main>

        <!-- Footer -->
        <footer class="py-20 text-center mt-auto">
            <div class="w-12 h-1.5 bg-indigo-600 mx-auto mb-10 rounded-full"></div>
            <p id="statsCounter" class="text-slate-400 text-[10px] font-black uppercase tracking-[0.4em]">rhervel // 2026 // Blog de Tecnología</p>
        </footer>

        <!-- Toast de notificación -->
        <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-lg shadow-md flex items-center space-x-2 transition duration-300 translate-y-20 opacity-0 z-50">
            <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span id="toast-text">Enlace copiado.</span>
        </div>

        <script src="entradas.js"></script>

        <script>
        const uiTranslations = {
            es: {
                subtitle: "Tech & Innovation", heroTag: "Bitácora Digital",
                heroTitle: "Explora el futuro digital.", heroDesc: "Análisis profundos sobre Inteligencia Artificial, desarrollo de software, arquitectura de hardware y tendencias globales.",
                searchPlaceholder: "Buscar artículos...", catTodos: "Todos", catIa: "Inteligencia Artificial",
                catDesarrollo: "Software", catHardware: "Hardware", catCiberseguridad: "Ciberseguridad",
                catTendencias: "Tendencias", btnBack: "Volver", toastText: "¡Enlace copiado al portapapeles!",
                readNotes: "Leer artículo", stats: "rhervel // 2026 // Blog de Tecnología", notes: "artículos",
                categoryNames: { todos: "Todos", ia: "Inteligencia Artificial", desarrollo: "Software", hardware: "Hardware", ciberseguridad: "Ciberseguridad", tendencias: "Tendencias" }
            },
            en: {
                subtitle: "Tech & Innovation", heroTag: "Digital Log",
                heroTitle: "Explore the digital future.", heroDesc: "In-depth analysis on Artificial Intelligence, software development, hardware architecture, and global trends.",
                searchPlaceholder: "Search posts...", catTodos: "All", catIa: "Artificial Intelligence",
                catDesarrollo: "Software", catHardware: "Hardware", catCiberseguridad: "Cybersecurity",
                catTendencias: "Trends", btnBack: "Back", toastText: "Link copied to clipboard!",
                readNotes: "Read post", stats: "rhervel // 2026 // Tech Blog", notes: "posts",
                categoryNames: { todos: "All", ia: "Artificial Intelligence", desarrollo: "Software", hardware: "Hardware", ciberseguridad: "Cybersecurity", tendencias: "Trends" }
            }
        };

        let currentLanguage = 'es';
        let currentCategory = 'todos';
        let searchQuery = '';
        let currentArticleId = null;

        function changeLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('lang-es').className = lang === 'es' ? "px-2.5 py-1 rounded-md bg-white shadow-sm text-slate-900 transition" : "px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-900 transition";
            document.getElementById('lang-en').className = lang === 'en' ? "px-2.5 py-1 rounded-md bg-white shadow-sm text-slate-900 transition" : "px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-900 transition";
            
            document.getElementById('hero-tag').innerText = uiTranslations[lang].heroTag;
            document.getElementById('hero-title').innerText = uiTranslations[lang].heroTitle;
            document.getElementById('hero-desc').innerText = uiTranslations[lang].heroDesc;
            document.getElementById('searchInput').placeholder = uiTranslations[lang].searchPlaceholder;
            document.getElementById('btn-back').innerText = uiTranslations[lang].btnBack;
            document.getElementById('toast-text').innerText = uiTranslations[lang].toastText;

            document.getElementById('btn-todos').innerText = uiTranslations[lang].catTodos;
            document.getElementById('btn-ia').innerText = uiTranslations[lang].catIa;
            document.getElementById('btn-desarrollo').innerText = uiTranslations[lang].catDesarrollo;
            document.getElementById('btn-hardware').innerText = uiTranslations[lang].catHardware;
            document.getElementById('btn-ciberseguridad').innerText = uiTranslations[lang].catCiberseguridad;
            document.getElementById('btn-tendencias').innerText = uiTranslations[lang].catTendencias;

            if (currentArticleId) { showArticle(currentArticleId); } else { renderArticlesGrid(); }
        }

        function changeCategory(category) {
            currentCategory = category;
            const categories = ['todos', 'ia', 'desarrollo', 'hardware', 'ciberseguridad', 'tendencias'];
            categories.forEach(cat => {
                const btn = document.getElementById(`btn-${cat}`);
                if (btn) btn.className = "category-btn whitespace-nowrap text-slate-400 hover:text-indigo-600 pb-2 font-bold uppercase text-[10px] tracking-widest transition";
            });
            const activeBtn = document.getElementById(`btn-${category}`);
            if (activeBtn) activeBtn.className = "category-btn whitespace-nowrap text-indigo-600 border-b-2 border-indigo-600 pb-2 font-black uppercase text-[10px] tracking-widest";
            
            renderArticlesGrid();
        }

function renderArticlesGrid() {
    const gridContainer = document.getElementById('articlesGrid');
    gridContainer.innerHTML = '';

    const filtered = articles.filter(art => {
        const matchesCategory = currentCategory === 'todos' || art.category === currentCategory;
        const query = searchQuery.toLowerCase();
        const title = currentLanguage === 'es' ? art.title.toLowerCase() : (art.title_en ? art.title_en.toLowerCase() : art.title.toLowerCase());
        const intro = currentLanguage === 'es' ? art.intro.toLowerCase() : (art.intro_en ? art.intro_en.toLowerCase() : art.intro.toLowerCase());
        return matchesCategory && (title.includes(query) || intro.includes(query));
    });

    if (filtered.length === 0) {
        gridContainer.innerHTML = `<div class="col-span-full text-center py-12 text-xs font-bold text-slate-400 uppercase tracking-widest">No se han encontrado artículos.</div>`;
        return;
    }

    filtered.forEach(art => {
        const title = currentLanguage === 'es' ? art.title : (art.title_en || art.title);
        const intro = currentLanguage === 'es' ? art.intro : (art.intro_en || art.intro);
        const categoryLabel = currentLanguage === 'es' ? art.categoryLabel : (art.categoryLabel_en || art.categoryLabel);

        const card = document.createElement('div');
        // Estilos limpios: sin fondo blanco exterior, sin bordes y sin padding interior
        const baseClasses = "group cursor-pointer flex flex-col justify-between";
        const dynamicGridSize = art.gridClass || "md:col-span-4";
        
        card.className = `${baseClasses} ${dynamicGridSize}`;
        card.setAttribute('onclick', `showArticle(${art.id})`);

        let imageHTML = '';
        if (art.image) {
            imageHTML = `
                <div class="bg-slate-100 rounded-3xl overflow-hidden mb-6 aspect-video relative shadow-sm">
                    <img src="${art.image}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute top-6 left-6 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest text-slate-900">${categoryLabel}</div>
                </div>
            `;
        }

        card.innerHTML = `
            <article class="flex flex-col justify-between h-full">
                <div>
                    ${imageHTML}
                    <h4 class="text-xl font-bold text-slate-900 mb-2 group-hover:text-indigo-600 transition-colors">${title}</h4>
                    <p class="text-slate-500 text-sm leading-relaxed mb-4">${intro}</p>
                </div>
                <time class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${art.date || '2026'}</time>
            </article>
        `;
        gridContainer.appendChild(card);
    });

    lucide.createIcons();
    document.getElementById('statsCounter').innerText = `${uiTranslations[currentLanguage].stats}`;
}

        function filterArticles() {
            searchQuery = document.getElementById('searchInput').value;
            renderArticlesGrid();
        }

        function showArticle(id) {
            const art = articles.find(a => a.id === id);
            if (!art) return;
            currentArticleId = id;
            document.getElementById('homeView').className = "hidden";
            document.getElementById('articleView').className = "max-w-6xl mx-auto space-y-8";

            const title = currentLanguage === 'es' ? art.title : (art.title_en || art.title);
            const content = currentLanguage === 'es' ? art.content : (art.content_en || art.content);
            const categoryNames = uiTranslations[currentLanguage].categoryNames;
            
            document.getElementById('articleCategoryTag').innerText = categoryNames[art.category] || art.category;
            document.getElementById('articleTitle').innerText = title;
            document.getElementById('articleContent').innerHTML = content;

            const imageContainer = document.getElementById('articleImageContainer');
            const articleImg = document.getElementById('articleImage');
            
            if (art.image) {
                articleImg.src = art.image;
                articleImg.alt = title;
                imageContainer.classList.remove('hidden');
            } else {
                imageContainer.classList.add('hidden');
            }

            if (window.MathJax) { MathJax.typesetPromise(); }
            window.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        }

        function goHome() {
            currentArticleId = null;
            document.getElementById('articleView').className = "hidden";
            document.getElementById('homeView').className = "space-y-12";
            history.pushState("", document.title, window.location.pathname + window.location.search);
            renderArticlesGrid();
        }

        function copyArticleLink() {
            const url = window.location.origin + window.location.pathname + `#apunte-${currentArticleId}`;
            const tempInput = document.createElement("input");
            tempInput.value = url; document.body.appendChild(tempInput); tempInput.select(); document.execCommand("copy"); document.body.removeChild(tempInput);
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

        function checkUrlHash() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#apunte-')) {
                const id = parseInt(hash.replace('#apunte-', ''), 10);
                if (id) showArticle(id);
            }
        }

        window.onload = function () {
            changeLanguage('es');
            checkUrlHash();
        };
        </script>
    </body>
</html>
